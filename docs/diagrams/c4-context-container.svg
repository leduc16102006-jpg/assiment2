<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="496px" preserveAspectRatio="none" style="width:2035px;height:496px;background:#FFFFFF;" version="1.1" viewBox="0 0 2035 496" width="2035px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="470" x="775.5" y="23.1318">BREWLITE - C4 SYSTEM CONTEXT &amp; CONTAINER DIAGRAM (Sprint 2)</text><!--cluster BrewLite--><g id="cluster_BrewLite"><rect fill="none" height="313" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1.0;" width="1752" x="277" y="44.0986"/><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="133" x="1086.5" y="59.2305">BREWLITE SYSTEM</text></g><!--entity Frontend--><g id="elem_Frontend"><rect fill="#F1F1F1" height="164.8877" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="414" x="293" y="151.5986"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="131" x="303" y="174.7305">Frontend Application</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="208" x="303" y="190.8291">[Container: Next.js 16 / React 19]</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="302" x="303" y="206.9277">Deployment: Docker (local:3000) / Vercel (prod)</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4" x="303" y="223.0264">&#160;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="267" x="303" y="239.125">- Mobile-First PWA (Manifest + PNG Icons)</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="332" x="303" y="255.2236">- Menu, product customization (Size &amp; Multi-Topping)</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="367" x="303" y="271.3223">- Hybrid Cart (Guest localStorage -&gt; PostgreSQL DB Cart)</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="303" x="303" y="287.4209">- Login / Register, Checkout &amp; Retry Payment UI</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="394" x="303" y="303.5195">- Order Confirmation (AC-06.7 backend status verify) &amp; History</text></g><!--entity Backend--><g id="elem_Backend"><rect fill="#F1F1F1" height="261.4795" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="419" x="954" y="79.5986"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="80" x="964" y="102.7305">Backend API</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="341" x="964" y="118.8291">[Container: NestJS 12 / Node.js 20 &#183; Modular Monolith]</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="317" x="964" y="134.9277">Deployment: Docker (local:10000) / Render (prod)</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4" x="964" y="151.0264">&#160;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="57" x="964" y="167.125">Modules:</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="182" x="964" y="183.2236">- AuthModule (JWT + Bcrypt)</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="221" x="964" y="199.3223">- ProductsModule &amp; Shared Pricing</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="227" x="964" y="215.4209">- CartModule (PostgreSQL DB Cart)</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="314" x="964" y="231.5195">- OrdersModule (State Machine + Optimistic Lock)</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="399" x="964" y="247.6182">- PaymentsModule (Mock Wallet/Card + VNPay HMAC-SHA512)</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="126" x="964" y="263.7168">- PromotionsModule</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="346" x="964" y="279.8154">- SchedulerModule (OrdersExpiryJob EX-09a/09b 15m)</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="258" x="964" y="295.9141">- HealthModule (/health) &amp; PrismaModule</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4" x="964" y="312.0127">&#160;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="120" x="964" y="328.1113">Swagger: /api/docs</text></g><!--entity Database--><g id="elem_Database"><path d="M1673,125.0986 C1673,115.0986 1843,115.0986 1843,115.0986 C1843,115.0986 2013,115.0986 2013,125.0986 L2013,295.085 C2013,305.085 1843,305.085 1843,305.085 C1843,305.085 1673,305.085 1673,295.085 L1673,125.0986 " fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M1673,125.0986 C1673,135.0986 1843,135.0986 1843,135.0986 C1843,135.0986 2013,135.0986 2013,125.0986 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="134" x="1683" y="152.2305">Application Database</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="175" x="1683" y="168.3291">[Container: PostgreSQL 16]</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="320" x="1683" y="184.4277">Deployment: Docker (local) / Neon.tech SSL (prod)</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4" x="1683" y="200.5264">&#160;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="134" x="1683" y="216.625">- User, Cart, CartItem</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="311" x="1683" y="232.7236">- Product, Ingredient, RecipeItem, ToppingRecipe</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="225" x="1683" y="248.8223">- Order, OrderItem, OrderIngredient</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="264" x="1683" y="264.9209">- Payment, Promotion, LoyaltyTransaction</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4" x="1683" y="281.0195">&#160;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="278" x="1683" y="297.1182">Schema &amp; migrations managed by Prisma 6.</text></g><!--entity Customer--><g id="elem_Customer"><ellipse cx="49" cy="196.5986" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M49,204.5986 L49,231.5986 M36,212.5986 L62,212.5986 M49,231.5986 L36,246.5986 M49,231.5986 L62,246.5986 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="61" x="6" y="261.2305">Customer</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="86" x="6" y="277.3291">(Kh&#225;ch h&#224;ng)</text></g><!--entity VNPay--><g id="elem_VNPay"><rect fill="#F1F1F1" height="116.5918" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="266" x="1710" y="373.5986"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="101" x="1720" y="396.7305">VNPay Sandbox</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="177" x="1720" y="412.8291">[External Payment Gateway]</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4" x="1720" y="428.9277">&#160;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="246" x="1720" y="445.0264">Processes simulated ATM/QR payment</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="226" x="1720" y="461.125">transactions, calls IPN webhook and</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="215" x="1720" y="477.2236">redirects customer to Return URL.</text></g><!--link Customer to Frontend--><g id="link_Customer_Frontend"><path d="M92.24,234.0986 C138.85,234.0986 211.32,234.0986 286.97,234.0986 " fill="none" id="Customer-to-Frontend" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="292.97,234.0986,283.97,230.0986,287.97,234.0986,283.97,238.0986,292.97,234.0986" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="137" x="123" y="216.2925">Uses Mobile-First PWA</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="41" x="171" y="231.2412">HTTPS</text></g><!--link Frontend to Backend--><g id="link_Frontend_Backend"><path d="M707.13,226.6186 C785.62,223.7686 869.084,220.7465 947.804,217.8865 " fill="none" id="Frontend-to-Backend" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="953.8,217.6686,944.6607,213.998,948.8033,217.8502,944.9512,221.9928,953.8,217.6686" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="92" x="784.5" y="187.2925">Calls REST API</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="87" x="787" y="202.2412">HTTPS / JSON</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="185" x="738" y="217.1899">Bearer JWT + Idempotency-Key</text></g><!--link Backend to Database--><g id="link_Backend_Database"><path d="M1373.3,210.0986 C1469.43,210.0986 1576.02,210.0986 1666.75,210.0986 " fill="none" id="Backend-to-Database" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1672.75,210.0986,1663.75,206.0986,1667.75,210.0986,1663.75,214.0986,1672.75,210.0986" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="117" x="1464.5" y="192.2925">Reads &amp; writes data</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="225" x="1410.5" y="207.2412">Prisma ORM / ACID SQL Transactions</text></g><!--link Backend to VNPay--><g id="link_Backend_VNPay"><path d="M1373.04,246.4086 C1479.77,267.5386 1596.78,295.3986 1643,323.0986 C1660.29,333.4586 1656.75,345.1786 1673,357.0986 C1684.39,365.4486 1691.5964,370.2686 1704.4264,377.2886 " fill="none" id="Backend-to-VNPay" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1709.69,380.1686,1703.7146,372.3395,1705.3037,377.7686,1699.8746,379.3577,1709.69,380.1686" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="154" x="1446" y="236.2925">Generates HMAC-SHA512</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="121" x="1462.5" y="251.2412">signed payment URL</text></g><!--reverse link Backend to VNPay--><g id="link_Backend_VNPay"><path d="M1360.2771,343.4208 C1376.1571,351.4308 1386.93,355.9986 1403,362.0986 C1417.45,367.5886 1585.83,393.6286 1709.77,412.3486 " fill="none" id="Backend-backto-VNPay" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1354.92,340.7186,1361.1542,348.3433,1359.3842,342.9704,1364.7571,341.2005,1354.92,340.7186" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="216" x="1415" y="344.2925">GET /payments/vnpay/ipn (Webhook)</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="238" x="1404" y="359.2412">&amp; GET /payments/vnpay/return (Redirect)</text></g><!--link Frontend to VNPay--><g id="link_Frontend_VNPay"><path d="M702.62,316.6786 C779.94,344.7086 869.81,372.9886 954,389.0986 C1218.54,439.7086 1529.0317,441.4397 1703.7417,437.3297 " fill="none" id="Frontend-to-VNPay" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1709.74,437.1886,1700.6484,433.4014,1704.7414,437.3062,1700.8366,441.3992,1709.74,437.1886" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="113" x="1107" y="371.2925">Redirects customer</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="164" x="1081.5" y="386.2412">to VNPay Sandbox (HTTPS)</text></g><!--SRC=[bLPVS-8s47_dK-pa8OKf1CZrqWapxOm11vpZtzdEvJhb7eGji1fRyaZYYA_Jxz9-YhxtlbXN5YOawILJ7i2MTd-x-_kjLgHqhK4Ba6oJQ8YPf95cWjTgwexnd4YIWKf8B7QCRs1DKaMFTZB1HPH8aL7GSdky4zCrsQRwId0z8xXzuaX6qfCZYvn4TsH30rsa54nKmZVfCKGaibnmolLJavfc6XVwldixyK8NMZ3u0O9VWj2Tmc0-2zsF8PoMJuutStqOUix8TwPG3tB9k8RpHgts7VpqhG_kBTpvOkA-Q4GYBIIS3BPAO_booUllagz_HGaaN__acyO940NLvclX3fNO8bwqFj009q_Sof1zINSJfYdyNgi1VexChoIAGNaCJfwdB296vYN_TO2hX74gUp2Zz_hiDmNT2sY3Jx54w5v-Ml8XpLDHP2X53uOYkgCIwgc8IDfxq-bq6cZyWSg8fb3FfOWRIuHjmLIiM4fRLqmg3OjR1-fJmjcQujlti9YDm8i4LutIbF9j4upl5aD69MliIvaWYiQ-K9HpYjt4Mg78Ssp4qcjSh2IBOK2aXlfeQu3Bf08K1XiBMZ_3GYYzaJHuFu5XlxGiFITYmtXPueOfJMKJ1WcDxiHMOo2VQbd0WfJrmerd7EOonfgHgJMJsJulPz3gN9pz22liOyEgqaHl5NocagsB1WAD4Ll8efIbulwPAFszjxFmdcgXz7K0tNFCSoPYQdGvxy0_VoEnyJOb4d-vI9bENXIeszahv6CKitnGg8IXgcVgSxOwiUzGlxuDKQ1-98lSihMmkgYzm