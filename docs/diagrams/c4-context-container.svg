<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="463px" preserveAspectRatio="none" style="width:1685px;height:463px;background:#FFFFFF;" version="1.1" viewBox="0 0 1685 463" width="1685px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="402" x="634.5" y="23.1318">BREWLITE - C4 SYSTEM CONTEXT &amp; CONTAINER DIAGRAM</text><!--cluster BrewLite--><g id="cluster_BrewLite"><rect fill="none" height="297" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1.0;" width="1391" x="263" y="44.0986"/><text fill="#000000" font-family="Arial" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="133" x="892" y="59.2305">BREWLITE SYSTEM</text></g><!--entity Frontend--><g id="elem_Frontend"><rect fill="#F1F1F1" height="164.8877" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="230" x="279" y="139.5986"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="131" x="289" y="162.7305">Frontend Application</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="168" x="289" y="178.8291">[Container: Next.js / React]</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4" x="289" y="194.9277">&#160;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="184" x="289" y="211.0264">- Menu and product selection</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="200" x="289" y="227.125">- Shopping cart (React Context)</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="109" x="289" y="243.2236">- Login / Register</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="148" x="289" y="259.3223">- Order and payment UI</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="171" x="289" y="275.4209">- Responsive web interface</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="210" x="289" y="291.5195">- Cart data stored in localStorage</text></g><!--entity Backend--><g id="elem_Backend"><rect fill="#F1F1F1" height="245.3809" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="234" x="793" y="79.5986"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="80" x="803" y="102.7305">Backend API</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="180" x="803" y="118.8291">[Container: NestJS / Node.js]</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4" x="803" y="134.9277">&#160;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="57" x="803" y="151.0264">Modules:</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="84" x="803" y="167.125">- AuthModule</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="111" x="803" y="183.2236">- ProductsModule</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="99" x="803" y="199.3223">- OrdersModule</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="117" x="803" y="215.4209">- PaymentsModule</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="126" x="803" y="231.5195">- PromotionsModule</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="98" x="803" y="247.6182">- PrismaModule</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4" x="803" y="263.7168">&#160;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="200" x="803" y="279.8154">Provides REST APIs, validation,</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="214" x="803" y="295.9141">authentication and business logic.</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="120" x="803" y="312.0127">Swagger: /api/docs</text></g><!--entity Database--><g id="elem_Database"><path d="M1438,101.0986 C1438,91.0986 1538,91.0986 1538,91.0986 C1538,91.0986 1638,91.0986 1638,101.0986 L1638,303.2822 C1638,313.2822 1538,313.2822 1538,313.2822 C1538,313.2822 1438,313.2822 1438,303.2822 L1438,101.0986 " fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M1438,101.0986 C1438,111.0986 1538,111.0986 1538,111.0986 C1538,111.0986 1638,111.0986 1638,101.0986 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="134" x="1448" y="128.2305">Application Database</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="155" x="1448" y="144.3291">[Container: PostgreSQL]</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4" x="1448" y="160.4277">&#160;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="45" x="1448" y="176.5264">- Users</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="65" x="1448" y="192.625">- Products</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="53" x="1448" y="208.7236">- Orders</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="71" x="1448" y="224.8223">- Payments</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="80" x="1448" y="240.9209">- Promotions</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="99" x="1448" y="257.0195">- Inventory data</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4" x="1448" y="273.1182">&#160;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="180" x="1448" y="289.2168">Schema managed by Prisma</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="160" x="1448" y="305.3154">with database migrations.</text></g><!--entity Customer--><g id="elem_Customer"><ellipse cx="49" cy="184.5986" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M49,192.5986 L49,219.5986 M36,200.5986 L62,200.5986 M49,219.5986 L36,234.5986 M49,219.5986 L62,234.5986 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="61" x="6" y="249.2305">Customer</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="86" x="6" y="265.3291">(Kh&#225;ch h&#224;ng)</text></g><!--entity VNPay--><g id="elem_VNPay"><rect fill="#F1F1F1" height="100.4932" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="282" x="1397" y="357.0986"/><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="101" x="1407" y="380.2305">VNPay Sandbox</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="177" x="1407" y="396.3291">[External Payment Gateway]</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="4" x="1407" y="412.4277">&#160;</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="188" x="1407" y="428.5264">Processes simulated payment</text><text fill="#000000" font-family="Arial" font-size="14" lengthAdjust="spacing" textLength="262" x="1407" y="444.625">transactions and returns payment results.</text></g><!--link Customer to Frontend--><g id="link_Customer_Frontend"><path d="M92.06,222.0986 C138.3,222.0986 208.56,222.0986 272.74,222.0986 " fill="none" id="Customer-to-Frontend" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="278.74,222.0986,269.74,218.0986,273.74,222.0986,269.74,226.0986,278.74,222.0986" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="123" x="123" y="204.2925">Uses web application</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="41" x="164" y="219.2412">HTTPS</text></g><!--link Frontend to Backend--><g id="link_Frontend_Backend"><path d="M509.07,217.6586 C593.36,214.3786 701.7345,210.1618 786.5845,206.8618 " fill="none" id="Frontend-to-Backend" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="792.58,206.6286,783.4313,202.9814,787.5838,206.8229,783.7423,210.9754,792.58,206.6286" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="92" x="605" y="175.2925">Calls REST API</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="87" x="607.5" y="190.2412">HTTPS / JSON</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="222" x="540" y="205.1899">Bearer JWT for authenticated requests</text></g><!--link Backend to Database--><g id="link_Backend_Database"><path d="M1027.28,202.0986 C1145.38,202.0986 1320.31,202.0986 1431.84,202.0986 " fill="none" id="Backend-to-Database" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1437.84,202.0986,1428.84,198.0986,1432.84,202.0986,1428.84,206.0986,1437.84,202.0986" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="129" x="1147.5" y="184.2925">Reads and writes data</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="113" x="1155.5" y="199.2412">Prisma ORM / SQL</text></g><!--link Backend to VNPay--><g id="link_Backend_VNPay"><path d="M1027.1,224.4186 C1141.84,247.6186 1308.45,284.7286 1367,315.0986 C1382.66,323.2186 1382.22,331.4686 1397,341.0986 C1405.44,346.5986 1409.1643,349.0043 1418.3343,354.0543 " fill="none" id="Backend-to-VNPay" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1423.59,356.9486,1417.636,349.1033,1419.2102,354.5367,1413.7768,356.1109,1423.59,356.9486" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="308" x="1058" y="230.2925">Creates and processes payment transactions HTTPS</text></g><!--reverse link Backend to VNPay--><g id="link_Backend_VNPay"><path d="M1032.1787,325.3171 C1041.7987,331.7871 1046.79,334.2586 1057,339.0986 C1182.59,398.6186 1229.47,360.0886 1367,380.0986 C1376.76,381.5186 1386.83,383.0186 1396.96,384.5586 " fill="none" id="Backend-backto-VNPay" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1027.2,321.9686,1032.4358,330.3105,1031.3489,324.759,1036.9004,323.6722,1027.2,321.9686" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="226" x="1099" y="336.2925">Sends payment result through callback</text></g><!--link Frontend to VNPay--><g id="link_Frontend_VNPay"><path d="M509.3,283.1086 C586.93,321.1486 693.24,366.7986 793,388.0986 C999.6,432.2086 1239.7906,428.0858 1390.7206,419.0858 " fill="none" id="Frontend-to-VNPay" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1396.71,418.7286,1387.4879,415.2714,1391.7189,419.0263,1387.9641,423.2573,1396.71,