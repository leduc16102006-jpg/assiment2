name: BrewLite CI Pipeline

on:
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  api-ci:
    name: Backend API (Install -> Lint -> Test -> Build)
    runs-on: ubuntu-latest

    
    # === Thêm PostgreSQL Service cho Integration Test ===
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brewlite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    # === Thêm Biến Môi trường ===
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/brewlite_test?schema=public"
      JWT_SECRET: "ci_only_jwt_secret_change_me_for_production"

    defaults:
      run:
        working-directory: ./apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: 1. Install dependencies (Backend)
        run: npm ci

      - name: Generate Prisma Client (if schema exists)
        run: |
          if [ -f "prisma/schema.prisma" ]; then
            npx prisma generate
          fi

      # === THÊM ĐÚNG 3 DÒNG NÀY ĐỂ TẠO BẢNG TRÊN TEST DB ===
      - name: Push Database Schema
        run: npx prisma db push

      - name: 2. Lint Backend (oxlint)
        run: npm run lint

      - name: 3. Unit Test Backend (Jest)
        run: npm run test

      - name: 4. Build Backend (NestJS)
        run: npm run build

  web-ci:
    name: Frontend Web (Install -> Lint -> Test -> Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: 1. Install dependencies (Frontend)
        run: npm ci

      - name: 2. Lint Frontend (ESLint)
        run: npm run lint

      - name: 3. Unit Test Frontend (Node Test Runner)
        run: npm run test

      - name: 4. Build Frontend (Next.js)
        run: npm run build