services:
  # 1. DATABASE
  postgres:
    image: postgres:16
    container_name: brewlite_postgres_local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-brewlite_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-brewlite_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. BACKEND API
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: brewlite_api_local
    ports:
      - "10000:10000"
    environment:
      - PORT=10000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-brewlite_db}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - VNPAY_TMN_CODE=${VNPAY_TMN_CODE}
      - VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET}
      - VNPAY_PAYMENT_URL=${VNPAY_PAYMENT_URL}
      - VNPAY_RETURN_URL=${VNPAY_RETURN_URL:-http://localhost:10000/payments/vnpay/return}
    depends_on:
      postgres:
        condition: service_healthy

  # 3. FRONTEND WEB
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:10000}
    container_name: brewlite_web_local
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:10000}
    depends_on:
      - api

volumes:
  postgres_data_local: