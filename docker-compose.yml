version: '3.8'

services:
  # 1. DATABASE
  postgres:
    image: postgres:16
    container_name: brewlite_postgres_local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brewlite_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

# 2. BACKEND API
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: brewlite_api_local
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/brewlite_db?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - VNPAY_TMN_CODE=${VNPAY_TMN_CODE}
      - VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET}
      - VNPAY_PAYMENT_URL=${VNPAY_PAYMENT_URL}
      - VNPAY_RETURN_URL=${VNPAY_RETURN_URL}
    depends_on:
      postgres:
        condition: service_healthy

  # 3. FRONTEND WEB
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: brewlite_web_local
    ports:
      - "3001:3000" # Mở cổng 3001 ở trình duyệt, trỏ vào cổng 3000 của Next.js
    environment:
      # Khi chạy trên trình duyệt người dùng, gọi API theo localhost
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    depends_on:
      - api

volumes:
  postgres_data_local: